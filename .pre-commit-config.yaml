# The hook set follows what this tree holds: file hygiene, secret scanning,
# spelling and justfile formatting always; the Python checks because of
# pyproject.toml; the YAML, TOML and markdown checks because of those files.
# The hooks that read Python or nix source are inert while the tree has none.
exclude: ^.*\.egg-info/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.50.2
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.18
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.77
    hooks:
      - id: rumdl-check
        args: [--fix]

  - repo: local
    hooks:
      # A local hook, because the formatter is the task runner itself. It is
      # resolved through this repository's lockfile, never by whichever build
      # is first on the path: formatter output differs between builds. The
      # files pattern covers the `*.just` modules as well as the justfile.
      - id: format-justfile
        name: format justfile
        entry: bash -c 'for f in "$@"; do uv run just --fmt --unstable --justfile "$f"; done' --
        language: system
        files: (^|/)justfile$|\.just$

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      # Manual stage only: it reaches an advisory database over the network,
      # and a commit never waits on a remote service.
      - id: pip-audit
        name: pip-audit
        entry: >-
          bash -c 'uv export --no-hashes --no-emit-workspace --no-dev --quiet
          | uvx --quiet pip-audit --requirement /dev/stdin --disable-pip --no-deps --strict'
        language: system
        stages: [manual]
        always_run: true
        pass_filenames: false
