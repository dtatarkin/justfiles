[project]
name = "justfiles"
version = "0.1.0dev0"
description = "A modular collection of [just](https://github.com/casey/just) recipes to supercharge your development workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# mypy, ty and rust-just are run by the commit hooks through `uv run`, so the
# lockfile is where their versions are pinned.
[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pre-commit>=4.5.1",
  "pytest>=8.0",
  "rust-just>=1.58.0",
  "ty>=0.0.84",
]

# This repository ships `just` modules, not a Python distribution: there is no
# package to build, so the project environment holds the development tools only.
[tool.uv]
package = false
# The lockfile resolves under the hook pins' seven-day cooldown: a release less
# than a week old is where a broken or compromised upload is still live.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TID"]
extend-select = ["S"]
# Calling a tool by name is the contract here, so the two subprocess rules fire
# on correct code.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests are made of asserts, and of fixtures named password, secret and token:
# the credential rules match the name, never the value.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__".msg = "from __future__ imports are forbidden (Python floor is 3.12)"

[tool.mypy]
python_version = "3.12"
strict = true
