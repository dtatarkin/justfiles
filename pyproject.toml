[project]
name = "justfiles"
version = "0.1.0dev0"
description = "A modular collection of [just](https://github.com/casey/just) recipes to supercharge your development workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__".msg = "from __future__ imports are forbidden (Python floor is 3.12)"

[tool.mypy]
python_version = "3.12"
strict = true
