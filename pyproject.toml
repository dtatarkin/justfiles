[project]
name = "justfiles"
version = "0.1.0dev0"
description = "A modular collection of [just](https://github.com/casey/just) recipes to supercharge your development workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cascade-pins = "cascade_pins.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_pins"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cascade_pins"]
